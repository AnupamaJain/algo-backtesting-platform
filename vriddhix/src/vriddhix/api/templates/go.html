{% extends "base.html" %}
{% block title %}Opening the {{ target }} — Pramana{% endblock %}
{% block content %}
<section class="wrap narrow" style="padding-block:64px">
  <p id="go-msg" class="muted">Opening the {{ target }}…</p>
  <p id="go-err" class="faint" hidden></p>
</section>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var target = {{ target | tojson }};
  var msg = document.getElementById("go-msg"), err = document.getElementById("go-err");
  var t = null; try { t = localStorage.getItem("vriddhix-token"); } catch (e) {}
  if (!t) { location.replace("/login?next=" + encodeURIComponent("/go/" + target)); return; }
  fetch("/api/v1/auth/handoff", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + t },
    body: JSON.stringify({ target: target })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) {
        msg.textContent = "Could not open the " + target + ".";
        err.textContent = (res.d.error && res.d.error.message) || "Not paired with this server.";
        err.hidden = false; return;
      }
      location.replace(res.d.url);
    }).catch(function () { msg.textContent = "Could not reach the server."; });
})();
</script>
{% endblock %}
