<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D16; --panel:#10141F; --panel2:#141A29; --raised:#1A2136; --border:#232C40; --border-soft:#1A2233;
  --navy:#1E2761; --navy2:#141B44; --ice:#CADCFC; --teal:#1C7293; --accent:#00A896; --accent-soft:rgba(0,168,150,.14);
  --green:#1E8E5A; --green-soft:rgba(30,142,90,.15); --red:#B23A2E; --red-soft:rgba(178,58,46,.16);
  --amber:#B4790A; --amber-soft:rgba(180,121,10,.16); --teal-soft:rgba(28,114,147,.18); --navy-soft:rgba(30,39,97,.35);
  --text:#E7ECF6; --text-dim:#95A0BE; --text-faint:#565F80; --line:#232C40;
  --f-head:'Space Grotesk',sans-serif; --f-body:'Inter',sans-serif; --f-mono:'JetBrains Mono',monospace;
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#2A3350;border-radius:4px;}
a{color:inherit;}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
.sidebar{background:var(--panel);border-right:1px solid var(--border-soft);padding:18px 12px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 20px;}
.brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--navy),var(--teal));display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:700;font-size:13px;}
.brand h1{font-family:var(--f-head);font-size:15.5px;font-weight:700;margin:0;}
.brand p{margin:0;font-size:9.5px;color:var(--text-faint);}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:3px;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);}
.nav-item .ic{width:18px;text-align:center;}
.side-foot{margin-top:24px;padding:14px;background:var(--panel2);border:1px solid var(--border-soft);border-radius:10px;}
.side-foot .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;}
.side-foot .val{font-family:var(--f-mono);font-size:13px;font-weight:700;margin-top:4px;}

.main{min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;border-bottom:1px solid var(--border-soft);background:var(--panel);position:sticky;top:0;z-index:20;}
.crumb{font-family:var(--f-head);font-size:16px;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:14px;}

.gate{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:6px 8px 6px 14px;}
.gate .lbl{font-size:11px;font-weight:700;color:var(--text-dim);}
.gate-toggle{position:relative;width:56px;height:28px;border-radius:20px;cursor:pointer;transition:.15s;}
.gate-toggle.dry{background:var(--amber-soft);border:1px solid var(--amber);}
.gate-toggle.live{background:var(--red-soft);border:1px solid var(--red);}
.gate-toggle::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;top:2px;left:2px;transition:.15s;background:var(--amber);}
.gate-toggle.live::after{transform:translateX(28px);background:var(--red);}
.gate-state{font-family:var(--f-mono);font-size:11px;font-weight:700;}
.gate-state.dry{color:var(--amber);} .gate-state.live{color:var(--red);}

.user-chip{display:flex;align-items:center;gap:8px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

.page{padding:24px 28px 60px;}
.card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);}
.card+.card{margin-top:16px;}
.card-pad{padding:18px 20px;}
.card-head{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;}
.section-title{font-family:var(--f-head);font-size:15px;font-weight:700;margin:0;}
.section-sub{font-size:11.5px;color:var(--text-faint);margin:3px 0 0;}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin:0 0 4px;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.stat-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px;}
.stat-card .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;}
.stat-card .v{font-family:var(--f-mono);font-size:21px;font-weight:700;margin-top:6px;}
.stat-card .s{font-size:10.5px;color:var(--text-faint);margin-top:3px;}
.pos{color:var(--green);} .neg{color:var(--red);}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;}
.pill.green{background:var(--green-soft);color:var(--green);} .pill.red{background:var(--red-soft);color:var(--red);}
.pill.amber{background:var(--amber-soft);color:var(--amber);} .pill.teal{background:var(--teal-soft);color:#5FB8D6;}
.pill.accent{background:var(--accent-soft);color:var(--accent);} .pill.gray{background:var(--panel2);color:var(--text-dim);border:1px solid var(--border);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--border);}
tbody td{padding:10px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);}
tbody tr:hover{background:var(--panel2);}
.mono{font-family:var(--f-mono);}

.btn{border:none;border-radius:8px;font-weight:700;font-size:12px;padding:9px 15px;}
.btn.primary{background:linear-gradient(180deg,var(--teal),#155b73);color:#fff;}
.btn.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
.btn.danger{background:var(--red-soft);border:1px solid var(--red);color:#ff9d92;}
.btn.small{padding:7px 12px;font-size:11.5px;}
.btn.full{width:100%;}

/* strategies */
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.strat-card{border:1px solid var(--border-soft);border-radius:12px;padding:16px 18px;background:var(--panel2);}
.strat-card.partial{border-style:dashed;border-color:var(--amber);}
.strat-head{display:flex;justify-content:space-between;align-items:flex-start;}
.strat-head h4{margin:0 0 4px;font-family:var(--f-head);font-size:14.5px;}
.strat-desc{font-size:11.5px;color:var(--text-dim);margin:6px 0 12px;line-height:1.4;}
.strat-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.strat-actions{display:flex;gap:8px;}
.strat-config{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:none;}
.strat-config.open{display:block;}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cfg-field label{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;font-weight:700;display:block;margin-bottom:5px;}
.cfg-field input,.cfg-field select{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-size:12px;font-family:var(--f-mono);}

/* brokers */
.mode-toggle-row{display:flex;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:4px;width:fit-content;}
.mode-toggle-row button{border:none;background:transparent;color:var(--text-dim);font-size:12px;font-weight:700;padding:9px 18px;border-radius:7px;}
.mode-toggle-row button.active{background:var(--accent);color:#04241f;}
.broker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.broker-card{border:1px solid var(--border-soft);border-radius:12px;padding:16px;background:var(--panel2);position:relative;}
.broker-card .phase-badge{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;}
.broker-card h4{margin:0 0 4px;font-family:var(--f-head);font-size:13.5px;}
.broker-card .auth-fam{font-size:10.5px;color:var(--text-faint);margin-bottom:10px;}
.assign-table td, .assign-table th{padding:8px 10px;}

/* activity */
.trace-modal{position:fixed;inset:0;background:rgba(4,6,12,.65);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.trace-modal.show{display:flex;}
.trace-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:720px;max-width:96vw;max-height:88vh;overflow:auto;padding:22px 24px;}
.trace-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.trace-step:last-child{border-bottom:none;}
.trace-num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
.trace-step h5{margin:0 0 2px;font-size:12.5px;font-weight:700;}
.trace-step p{margin:0;font-size:11px;color:var(--text-faint);}

/* watchdogs */
.wd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* system map */
.map-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.map-bucket{flex:1;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--panel2);cursor:pointer;}
.map-bucket:hover{border-color:var(--accent);}
.map-bucket h5{margin:0 0 8px;font-family:var(--f-head);font-size:13px;}
.map-node{font-size:10.5px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 8px;margin:3px 3px 0 0;display:inline-block;color:var(--text-dim);}
.map-arrow{color:var(--text-faint);font-size:20px;}
.detail-panel{position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--panel);border-left:1px solid var(--border);padding:24px;transform:translateX(100%);transition:.2s;z-index:150;overflow-y:auto;}
.detail-panel.show{transform:translateX(0);}
.detail-panel h3{font-family:var(--f-head);font-size:16px;margin:0 0 6px;}
.detail-panel .req{background:var(--panel2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:11.5px;color:var(--text-dim);}
.detail-panel .req b{color:var(--accent);font-family:var(--f-mono);font-size:10.5px;display:block;margin-bottom:3px;}
.close-panel{position:absolute;top:20px;right:20px;background:var(--panel2);border:1px solid var(--border);width:28px;height:28px;border-radius:50%;color:var(--text);}

@media (max-width:1200px){ .stat-grid,.strat-grid,.broker-grid,.wd-grid{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="brand"><div class="mark">TS</div><div><h1>Trading Ops</h1><p>Console · ui-trading-system</p></div></div>
    <div id="navList"></div>
    <div class="side-foot">
      <div class="lbl">Broker Mode</div>
      <div class="val" id="sideBrokerMode">Single</div>
    </div>
    <div class="side-foot" style="margin-top:10px;">
      <div class="lbl">Active Strategies</div>
      <div class="val" id="sideActiveCount">0 / 5</div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="topbar-right">
        <div class="gate" onclick="toggleGate()">
          <span class="gate-state" id="gateLabel"></span>
          <div class="gate-toggle" id="gateToggle"></div>
        </div>
        <div class="user-chip"><div class="avatar">O</div><div style="font-size:12px;font-weight:700;">Operator</div></div>
      </div>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>

<!-- order trace modal -->
<div class="trace-modal" id="traceModal">
  <div class="trace-box" id="traceBox"></div>
</div>

<!-- system map detail panel -->
<div class="detail-panel" id="detailPanel">
  <button class="close-panel" onclick="closeDetail()">✕</button>
  <div id="detailBody"></div>
</div>

<script>

   DATA — grounded in the base PRD, broker-abstraction PRD, HLD, LLD
================================================================ */

const BROKERS = [
  {id:'zerodha', name:'Zerodha', full:'Kite Connect', auth:'oauth', phase:0, connected:true},
  {id:'dhan', name:'Dhan', full:'Dhan API', auth:'apikey', phase:2, connected:true},
  {id:'shoonya', name:'Shoonya', full:'Finvasia · NorenAPI', auth:'totp', phase:3, connected:false},
  {id:'flattrade', name:'Flattrade', full:'NorenAPI', auth:'totp', phase:3, connected:false},
  {id:'fyers', name:'Fyers', full:'Fyers API', auth:'oauth', phase:4, connected:false},

  {id:'aliceblue', name:'Alice Blue', full:'ANT API · 2FA', auth:'totp2fa', phase:5, connected:false},
];
const PHASE_COLOR = {0:'#1E2761',1:'#565F80',2:'#1E8E5A',3:'#1C7293',4:'#00A896',5:'#B4790A'};
const AUTH_LABEL = {oauth:'OAuth Redirect', apikey:'Static API Key', totp:'TOTP + Credential', totp2fa:'TOTP + 2FA'};

const POSITIONS = [
  ['NIFTY 24950 PE','zerodha','SELL 300','₹42.10','₹31.80','-0.19','+₹3,090','pos'],
  ['NIFTY FUT (bracket)','dhan','BUY 75','₹24,812.4','₹24,838.0','0.98','+₹1,920','pos'],
  ['BANKNIFTY 55600 CE','zerodha','SELL 30','₹58.40','₹71.20','0.24','-₹384','neg'],
  ['SBIN 820 CE','upstox','SELL 1','₹18.50','₹14.20','-0.31','+₹430','pos'],
];

const ORDERS = [
  {time:'09:31:14', strategy:'Wave Extractor', broker:'Dhan', symbol:'NIFTY FUT', side:'BUY', qty:75, price:'24,838.00', status:'COMPLETE', mode:'live'},
  {time:'09:28:02', strategy:'Survivor', broker:'Zerodha', symbol:'NIFTY 24950 PE', side:'SELL', qty:300, price:'42.10', status:'COMPLETE', mode:'live'},

const WATCHDOGS = [
  {name:'GTT Monitor', desc:'Watches GTT triggers, dedupes, suppresses stale GTTs when market closed.', rows:[['NIFTY 24700 PE exit','Zerodha','Valid','green'],['BANKNIFTY 55400 PE exit','Zerodha','Pending trigger','amber'],['Old SBIN GTT (3d old, market closed)','Upstox','Suppressed (stale)','red']]},
  {name:'Position Guard', desc:'Flags unreviewed exposure across positions, orders, and pending GTTs — read-only.', rows:[['SBIN 820 CE — SELL 1','Upstox','Unreviewed 2h','amber'],['NIFTY 24950 PE — SELL 300','Zerodha','Reviewed','green'],['BANKNIFTY 55600 CE — SELL 30','Zerodha','Unreviewed 40m','amber']]},

const MAP_DETAIL = {
  strategies:{title:'Strategy Processes', body:'Each runs as its own OS process, tracked by PID. The dashboard refuses to double-spawn a process for a symbol that already has one running.',

  engine:{title:'Shared Engine ("the brain")', body:'Every strategy calls into this layer for order placement, positions, instruments, and Greeks — never a broker SDK directly.',

  adapters:{title:'Broker Adapters (new)', body:'One concrete implementation of the BrokerAdapter interface per broker. Strategies and common_lib never know which one is active.',

  watchdogs:{title:'Watchdogs ("the observers")', body:'Observe, log, and flag. None of them place or modify a trade — that distinction is architectural, not incidental.',
    reqs:[['FR-O1','GTT Monitor must dedupe and suppress stale GTTs when market is closed.'],['FR-O2','Position Guard flags unreviewed exposure — a read-only flag, not an automated close.']]},
};

/* ================================================================
   STATE
================================================================ */
const STATE = {
  page:'dashboard',
  dryRun:true,
  brokerMode:'single',
  activeBroker:'zerodha',
  strategies:JSON.parse(JSON.stringify(STRATEGIES)),
  brokers:JSON.parse(JSON.stringify(BROKERS)),
  openConfig:null,
};

/* ================================================================
   NAV + TOPBAR
================================================================ */
function renderNav(){
  document.getElementById('navList').innerHTML = NAV.map(([id,ic,label])=>
    `<div class="nav-item ${STATE.page===id?'active':''}" onclick="goto('${id}')"><span class="ic">${ic}</span>${label}</div>`).join("");
  document.getElementById('sideBrokerMode').textContent = STATE.brokerMode==='single' ? 'Single — '+BROKERS.find(b=>b.id===STATE.activeBroker).name : 'Multi-broker';
  document.getElementById('sideActiveCount').textContent = STATE.strategies.filter(s=>s.status==='running').length + ' / ' + STATE.strategies.length;
}
function goto(id){ STATE.page = id; render(); }

function renderTopbar(){
  const titles = {dashboard:'Dashboard', strategies:'Strategies', brokers:'Brokers', activity:'Order Activity', watchdogs:'Watchdogs', map:'System Map'};
  document.getElementById('crumb').textContent = titles[STATE.page];
  const gt = document.getElementById('gateToggle'), gl = document.getElementById('gateLabel');
  gt.className = 'gate-toggle ' + (STATE.dryRun ? 'dry' : 'live');
  gl.className = 'gate-state ' + (STATE.dryRun ? 'dry' : 'live');
  gl.textContent = STATE.dryRun ? 'DRY-RUN' : 'LIVE';
}
function toggleGate(){
  if(STATE.dryRun){
    if(!confirm('Switch to LIVE trading? Orders will reach the broker. This mirrors the [safety] live_trading flag in configfile.ini.')) return;
  }
  STATE.dryRun = !STATE.dryRun;
  renderTopbar();
}

/* ================================================================
   ROOT RENDER
================================================================ */
function render(){
  renderNav();
  renderTopbar();
  const p = document.getElementById('page');
  if(STATE.page==='dashboard') p.innerHTML = dashboardHTML();
  else if(STATE.page==='strategies') p.innerHTML = strategiesHTML();
  else if(STATE.page==='brokers') p.innerHTML = brokersHTML();
  else if(STATE.page==='activity') p.innerHTML = activityHTML();
  else if(STATE.page==='watchdogs') p.innerHTML = watchdogsHTML();
  else if(STATE.page==='map') p.innerHTML = mapHTML();
}

/* ================================================================
   DASHBOARD
================================================================ */
function dashboardHTML(){
  const totalPnl = POSITIONS.reduce((a,p)=> a + parseFloat(p[6].replace(/[₹,+]/g,'')) * (p[7]==='neg'?-1:1), 0);
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="k">Net P&amp;L (today)</div><div class="v pos">+₹${totalPnl.toLocaleString('en-IN')}</div><div class="s">across ${new Set(POSITIONS.map(p=>p[1])).size} brokers</div></div>
    <div class="stat-card"><div class="k">Open Positions</div><div class="v">${POSITIONS.length}</div><div class="s">${STRATEGIES.filter(s=>s.status==='running').length} strategies running</div></div>
    <div class="stat-card"><div class="k">Capital Deployed</div><div class="v">₹8,42,600</div><div class="s">of ₹18,95,806 available</div></div>
    <div class="stat-card"><div class="k">Safety Gate</div><div class="v" style="color:${STATE.dryRun?'var(--amber)':'var(--red)'};">${STATE.dryRun?'DRY-RUN':'LIVE'}</div><div class="s">toggle top-right</div></div>
  </div>
  <div class="card">
    <div class="card-head"><div><h2 class="section-title">Live Positions</h2><p class="section-sub">Aggregated across every connected broker — unified via UnifiedPosition</p></div></div>
    <div class="card-pad">
      <table>
        <thead><tr><th>Instrument</th><th>Broker</th><th>Qty</th><th>Avg</th><th>LTP</th><th>Delta</th><th>P&amp;L</th></tr></thead>
        <tbody>${POSITIONS.map(p=>`<tr>
          <td><b style="color:var(--text);">${p[0]}</b></td>
          <td><span class="pill gray">${brokerLabel(p[1])}</span></td>
          <td class="mono">${p[2]}</td><td class="mono">${p[3]}</td><td class="mono">${p[4]}</td><td class="mono">${p[5]}</td>
          <td class="mono ${p[7]}">${p[6]}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
  </div>
  <div class="card card-pad" style="margin-top:16px;">
    <div class="section-title" style="margin-bottom:10px;">Three-Bucket Snapshot</div>
    <div class="map-row" style="margin-bottom:0;">
      <div class="map-bucket" onclick="goto('strategies')"><h5>🧠 Shared Engine</h5><span class="section-sub">common_lib · positions_lib · instrument_cache · greeks_lib</span></div>
      <div class="map-arrow">→</div>
      <div class="map-bucket" onclick="goto('strategies')"><h5>⚡ ${STRATEGIES.filter(s=>s.status==='running').length} Traders Running</h5><span class="section-sub">of ${STRATEGIES.length} strategy processes</span></div>
      <div class="map-arrow">→</div>
      <div class="map-bucket" onclick="goto('watchdogs')"><h5>◎ Watchdogs Clean</h5><span class="section-sub">1 unreviewed exposure flagged</span></div>
    </div>
  </div>`;
}
function brokerLabel(id){ const b = BROKERS.find(x=>x.id===id); return b ? b.name : id; }

/* ================================================================
   STRATEGIES
================================================================ */
function strategiesHTML(){
  return `
  <div class="section-sub" style="margin-bottom:14px;">Every strategy below calls the same shared order-placement path regardless of which broker is assigned to it (base PRD §5.2).</div>
  <div class="strat-grid">
    ${STATE.strategies.map(s=>`
    <div class="strat-card ${s.tag==='partial'?'partial':''}">
      <div class="strat-head">
        <div><h4>${s.name}</h4></div>
        <span class="pill ${s.status==='running'?'green':'gray'}">${s.status==='running'?'● Running':'○ Stopped'}</span>
      </div>
      <p class="strat-desc">${s.desc}</p>
      <div class="strat-meta">
        <span class="pill ${s.tag==='confirmed'?'accent':'amber'}">${s.tag==='confirmed'?'Confirmed':'Partially documented'}</span>
        ${s.pid?`<span class="pill gray">PID ${s.pid}</span>`:''}
        <span class="pill teal">Broker: ${brokerLabel(s.broker)}</span>
      </div>
      <div class="strat-actions">
        <button class="btn ${s.status==='running'?'danger':'primary'} small" onclick="toggleStrategy('${s.id}')">${s.status==='running'?'Stop':'Start'}</button>
        <button class="btn ghost small" onclick="toggleConfig('${s.id}')">Configure</button>
        ${STATE.brokerMode==='multi'?`<select onchange="assignBroker('${s.id}', this.value)" style="background:var(--panel);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:11.5px;padding:6px 8px;">
          ${BROKERS.filter(b=>b.connected).map(b=>`<option value="${b.id}" ${s.broker===b.id?'selected':''}>${b.name}</option>`).join("")}
        </select>`:''}
      </div>
      <div class="strat-config ${STATE.openConfig===s.id?'open':''}">
        <div class="cfg-grid">
          ${s.params.map(([k,v])=>`<div class="cfg-field"><label>${k}</label><input type="text" value="${v}"></div>`).join("")}
        </div>
      </div>
    </div>`).join("")}
  </div>`;
}
function toggleStrategy(id){
  const s = STATE.strategies.find(x=>x.id===id);
  s.status = s.status==='running' ? 'stopped' : 'running';
  s.pid = s.status==='running' ? Math.floor(40000+Math.random()*9999) : null;
  render();
}
function toggleConfig(id){ STATE.openConfig = STATE.openConfig===id ? null : id; render(); }
function assignBroker(sid, bid){ STATE.strategies.find(s=>s.id===sid).broker = bid; render(); }

/* ================================================================
   BROKERS
================================================================ */
function brokersHTML(){
  return `
  <div class="card card-pad">
    <div class="section-title" style="margin-bottom:10px;">Broker Mode</div>
    <div class="mode-toggle-row">
      <button class="${STATE.brokerMode==='single'?'active':''}" onclick="setBrokerMode('single')">Single-Broker</button>
      <button class="${STATE.brokerMode==='multi'?'active':''}" onclick="setBrokerMode('multi')">Multi-Broker</button>
    </div>
    ${STATE.brokerMode==='single' ? `
      <div style="margin-top:14px;">
        <label style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;font-weight:700;">Active broker</label><br>
        <select onchange="STATE.activeBroker=this.value;render();" style="margin-top:6px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:12.5px;">
          ${BROKERS.filter(b=>b.connected).map(b=>`<option value="${b.id}" ${STATE.activeBroker===b.id?'selected':''}>${b.name} (${b.full})</option>`).join("")}
        </select>
      </div>` : `
      <table class="assign-table" style="margin-top:14px;">
        <thead><tr><th>Strategy</th><th>Assigned Broker</th></tr></thead>
        <tbody>${STATE.strategies.map(s=>`<tr><td>${s.name}</td><td>
          <select onchange="assignBroker('${s.id}', this.value)" style="background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:6px 10px;font-size:12px;">
            ${BROKERS.filter(b=>b.connected).map(b=>`<option value="${b.id}" ${s.broker===b.id?'selected':''}>${b.name}</option>`).join("")}
          </select>
        </td></tr>`).join("")}</tbody>
      </table>
      <div class="section-sub" style="margin-top:10px;">Per broker PRD §9 Q4/Q5: Survivor's delta rebalancer and margin checks currently assume one account — verify scope before relying on this in production.</div>
    `}
  </div>

  <div class="card card-pad">
    <div class="section-title" style="margin-bottom:14px;">Broker Adapters</div>
    <div class="broker-grid">
      ${STATE.brokers.map(b=>`
      <div class="broker-card">
        <div class="phase-badge" style="background:${PHASE_COLOR[b.phase]};">${b.phase}</div>
        <h4>${b.name}</h4>
        <div class="auth-fam">${b.full} · ${AUTH_LABEL[b.auth]}</div>
        <span class="pill ${b.connected?'green':'gray'}" style="margin-bottom:10px;">${b.connected?'● Connected':'○ Not connected'}</span>
        <button class="btn ${b.connected?'ghost':'primary'} small full" style="margin-top:10px;" onclick="openAuthFlow('${b.id}')">${b.connected?'Reconnect':'Connect'}</button>
      </div>`).join("")}
    </div>
  </div>`;
}
function setBrokerMode(m){ STATE.brokerMode = m; render(); }
function openAuthFlow(id){
  const b = STATE.brokers.find(x=>x.id===id);
  let msg;
  if(b.auth==='oauth') msg = `${b.name} uses OAuthRedirectAuth.\n\nThis would redirect to ${b.name}'s login page, then exchange the returned request_token for an access_token (mirrors Zerodha's existing flow).`;
  else if(b.auth==='apikey') msg = `${b.name} uses StaticAPIKeyAuth.\n\nThis would prompt for an API key + access token — no redirect flow needed.`;
  else if(b.auth==='totp2fa') msg = `${b.name} uses TOTPCredentialAuth (2FA variant).\n\nThis would prompt for username, password, and a 2FA code from the broker's app.`;
  else msg = `${b.name} uses TOTPCredentialAuth.\n\nThis would prompt for username, password, TOTP code, and vendor code (NorenAPI convention, shared with Shoonya/Flattrade).`;
  if(confirm(msg + '\n\nSimulate a successful connection?')){
    b.connected = true;
    render();
  }
}

/* ================================================================
   ORDER ACTIVITY
================================================================ */
function activityHTML(){
  return `
  <div class="card card-pad" style="display:flex;justify-content:space-between;align-items:center;background:${STATE.dryRun?'var(--amber-soft)':'var(--red-soft)'};border-color:${STATE.dryRun?'var(--amber)':'var(--red)'};">
    <div><b style="color:${STATE.dryRun?'var(--amber)':'var(--red)'};">${STATE.dryRun?'DRY-RUN MODE':'LIVE MODE'}</b>
    <div class="section-sub" style="margin-top:4px;">${STATE.dryRun?'Every order below is fully logged but never reached a broker — place_order() returned sentinel -1.':'Orders below were sent to their broker\'s real API.'}</div></div>
  </div>
  <div class="card">
    <div class="card-head"><h2 class="section-title">Order Feed</h2></div>
    <div class="card-pad">
      <table>
        <thead><tr><th>Time</th><th>Strategy</th><th>Broker</th><th>Instrument</th><th>Side</th><th>Qty</th><th>Price</th><th>Status</th><th></th></tr></thead>
        <tbody>${ORDERS.map((o,i)=>`<tr>
          <td class="mono">${o.time}</td><td>${o.strategy}</td><td><span class="pill gray">${o.broker}</span></td>
          <td>${o.symbol}</td><td><span class="pill ${o.side==='BUY'?'green':'red'}">${o.side}</span></td>
          <td class="mono">${o.qty}</td><td class="mono">${o.price}</td>
          <td><span class="pill ${o.mode==='dry'?'amber':(o.status==='COMPLETE'?'green':'teal')}">${o.status}</span></td>
          <td><button class="btn ghost small" onclick="openTrace(${i})">Trace →</button></td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
  </div>`;
}
function openTrace(i){
  const o = ORDERS[i];
  document.getElementById('traceBox').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
      <div><h3 style="font-family:var(--f-head);margin:0 0 4px;">Order Lifecycle Trace</h3>
      <div class="section-sub">${o.strategy} · ${o.symbol} · ${o.broker} · ${o.time}</div></div>
      <button class="btn ghost small" onclick="closeTrace()">✕</button>
    </div>
    ${TRACE_STEPS.map((t,idx)=>{
      const skip = o.mode==='dry' && idx>2 && idx<6; // dry-run stops after the gate check, skips broker/persist path visually
      return `<div class="trace-step" style="opacity:${skip?0.35:1};">
        <div class="trace-num">${idx+1}</div>
        <div><h5>${t[0]}</h5><p>${t[1]}</p></div>
      </div>`;
    }).join("")}
    <div class="section-sub" style="margin-top:14px;">${o.mode==='dry' ? 'This order stopped at the dry-run gate (step 3) — steps 4-6 shown dimmed never executed.' : 'This order completed the full lifecycle through to poll-loop reconciliation.'}</div>
  `;
  document.getElementById('traceModal').classList.add('show');
}
function closeTrace(){ document.getElementById('traceModal').classList.remove('show'); }

/* ================================================================
   WATCHDOGS
================================================================ */
function watchdogsHTML(){
  return `<div class="wd-grid">
    ${WATCHDOGS.map(w=>`
    <div class="card">
      <div class="card-head"><div><h2 class="section-title">${w.name}</h2><p class="section-sub">${w.desc}</p></div></div>
      <div class="card-pad">
        <table><tbody>${w.rows.map(r=>`<tr><td>${r[0]}</td><td><span class="pill gray">${r[1]}</span></td><td><span class="pill ${r[3]}">${r[2]}</span></td></tr>`).join("")}</tbody></table>
      </div>
    </div>`).join("")}
  </div>`;
}

/* ================================================================
   SYSTEM MAP
================================================================ */
function mapHTML(){
  return `
  <div class="section-sub" style="margin-bottom:16px;">Click any layer to see the PRD requirements behind it. Strategy code never talks to a broker adapter or watchdog directly — everything routes through the Shared Engine.</div>
  ${MAP_LAYERS.map((layer,i)=>`
    <div class="map-row">
      <div class="map-bucket" onclick="openDetail('${layer.key}')" style="flex:none;width:180px;"><h5>${layer.title}</h5></div>
      <div style="flex:1;display:flex;flex-wrap:wrap;">${layer.nodes.map(n=>`<span class="map-node">${n}</span>`).join("")}</div>
    </div>
    ${i<MAP_LAYERS.length-1?'<div style="text-align:center;color:var(--text-faint);margin:-4px 0 4px 90px;">↓</div>':''}
  `).join("")}
  `;
}
function openDetail(key){
  const d = MAP_DETAIL[key];
  document.getElementById('detailBody').innerHTML = `
    <h3>${d.title}</h3>
    <p style="font-size:12.5px;color:var(--text-dim);line-height:1.5;">${d.body}</p>
    <div class="eyebrow" style="margin-top:16px;">Related requirements</div>
    ${d.reqs.map(r=>`<div class="req"><b>${r[0]}</b>${r[1]}</div>`).join("")}
  `;
  document.getElementById('detailPanel').classList.add('show');
}
function closeDetail(){ document.getElementById('detailPanel').classList.remove('show'); }

render();
</script>
</body>
</html>
